[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metop-groundstation"
version = "0.1.0"
description = "A manually operated local MetOp ground station"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "numpy>=1.26,<3", "httpx>=0.27,<1", "PyYAML>=6,<7",
  "pyorbital>=1.9,<2", "pydantic>=2.8,<3", "Pillow>=10,<13",
  "filelock>=3.15,<4", "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
gt = ["astropy>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundstation = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
